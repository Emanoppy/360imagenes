<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inyector 360 - RICOH THETA</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.130.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px; margin: 0; min-height: 100vh;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #9aa0a6; margin-top: 0; text-align: center; max-width: 520px; }
  #dropzone {
    width: 100%; max-width: 520px; min-height: 220px;
    border: 2px dashed #4b5563; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; padding: 24px; text-align: center;
    background: #171a21;
  }
  #dropzone.drag { border-color: #5b8dee; background: #1b2130; }
  #dropzone input { display: none; }
  #lista { width: 100%; max-width: 520px; margin-top: 16px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #171a21; border-radius: 8px; margin-bottom: 6px; font-size: .9rem; gap: 8px; }
  .item.ok { border-left: 3px solid #4caf50; }
  .item.fail { border-left: 3px solid #e05252; }
  .item span.nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .item button.ver360 {
    margin: 0; padding: 4px 10px; font-size: .78rem; border-radius: 6px;
    background: #2a3040; color: #cdd6e6; flex-shrink: 0;
  }
  .item button.ver360.activo { background: #5b8dee; color: white; }
  .row { width: 100%; max-width: 520px; display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  label.fov { font-size: .85rem; color: #9aa0a6; }
  input[type=number] { width: 70px; background: #171a21; border: 1px solid #333; color: #eee; padding: 6px; border-radius: 6px; }
  button {
    margin-top: 16px; padding: 10px 22px; border: none; border-radius: 10px;
    background: #5b8dee; color: white; font-size: 1rem; cursor: pointer;
  }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  #estado { margin-top: 12px; font-size: .9rem; color: #9aa0a6; min-height: 1.2em; }

  #previewBox {
    width: 100%; max-width: 520px; margin-top: 24px; display: none;
  }
  #previewBox.visible { display: block; }
  #previewHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #previewHeader h2 { font-size: 1rem; margin: 0; color: #cdd6e6; }
  #phoneFrame {
    width: 100%; max-width: 300px; margin: 0 auto;
    background: #1a1d24; border-radius: 34px; padding: 12px 9px;
    border: 1px solid #333a48; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #phoneNotch {
    width: 70px; height: 14px; background: #05060a; border-radius: 8px;
    margin: 0 auto 8px auto;
  }
  #previewCanvasWrap {
    width: 100%; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden;
    background: #05060a; position: relative; touch-action: none;
  }
  #previewCanvasWrap canvas { display: block; width: 100%; height: 100%; }
  #previewHint {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: .75rem; color: #ffffffaa; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #previewTools { display: flex; gap: 8px; margin-top: 10px; }
  #previewTools button {
    margin: 0; padding: 8px 14px; font-size: .82rem; background: #2a3040; color: #cdd6e6;
  }
  #previewTools button.on { background: #4caf50; color: white; }
</style>
</head>
<body>
  <h1>Inyector 360 (RICOH THETA S)</h1>
  <p class="sub">Arrastra tus fotos .jpg. Se les agrega el EXIF + XMP GPano equirectangular
     para que Facebook / Instagram las abran con el visor de esfera y giroscopio.</p>

  <div id="dropzone">
    <span>Arrastra tus fotos aqui, o hace click para elegirlas</span>
    <input type="file" id="fileInput" accept=".jpg,.jpeg" multiple>
  </div>

  <div class="row">
    <label class="fov">Campo de vision inicial (grados):</label>
    <input type="number" id="fov" value="75" min="30" max="120">
  </div>

  <div id="lista"></div>
  <button id="btnProcesar" disabled>Procesar y descargar .zip</button>
  <div id="estado"></div>

  <div id="previewBox">
    <div id="previewHeader">
      <h2 id="previewTitulo">Vista previa 360</h2>
    </div>
    <div id="phoneFrame">
      <div id="phoneNotch"></div>
      <div id="previewCanvasWrap">
        <span id="previewHint">Arrastra para girar</span>
      </div>
    </div>
    <div id="previewTools">
      <button id="btnGiroscopio">Activar giroscopio (celular)</button>
      <button id="btnFullscreen">Pantalla completa</button>
    </div>
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const lista = document.getElementById('lista');
  const btn = document.getElementById('btnProcesar');
  const estado = document.getElementById('estado');
  let archivos = [];
  let previewIndex = null;

  dropzone.addEventListener('click', () => fileInput.click());

  ['dragenter', 'dragover'].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', e => agregarArchivos(e.dataTransfer.files));
  fileInput.addEventListener('change', e => agregarArchivos(e.target.files));

  function agregarArchivos(fileList) {
    for (const f of fileList) {
      if (/\.(jpe?g)$/i.test(f.name)) archivos.push(f);
    }
    renderLista();
    if (previewIndex === null && archivos.length > 0 && typeof mostrarVista360 === 'function') {
      mostrarVista360(0);
    }
  }

  function renderLista() {
    lista.innerHTML = '';
    archivos.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'item';

      const nombre = document.createElement('span');
      nombre.className = 'nombre';
      nombre.textContent = f.name;
      div.appendChild(nombre);

      const verBtn = document.createElement('button');
      verBtn.className = 'ver360' + (i === previewIndex ? ' activo' : '');
      verBtn.textContent = 'Ver 360';
      verBtn.addEventListener('click', () => {
        if (typeof mostrarVista360 === 'function') {
          mostrarVista360(i);
        } else {
          estado.textContent = 'El visor 3D todavia esta cargando, espera un segundo...';
        }
      });
      div.appendChild(verBtn);

      lista.appendChild(div);
    });
    btn.disabled = archivos.length === 0;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    estado.textContent = 'Procesando ' + archivos.length + ' foto(s)...';

    const form = new FormData();
    archivos.forEach(f => form.append('fotos', f));
    form.append('fov', document.getElementById('fov').value);

    try {
      const resp = await fetch('/procesar', { method: 'POST', body: form });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        estado.textContent = 'Error: ' + (err.error || resp.statusText);
        btn.disabled = false;
        return;
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fotos_360.zip';
      a.click();
      URL.revokeObjectURL(url);
      estado.textContent = 'Listo. Se descargo fotos_360.zip';
      archivos = [];
      previewIndex = null;
      document.getElementById('previewBox').classList.remove('visible');
      renderLista();
    } catch (e) {
      estado.textContent = 'Error de conexion: ' + e.message;
    }
    btn.disabled = archivos.length === 0;
  });

  // --- Vista previa 360 (Three.js) ---
  // La textura se ve igual con o sin metadatos inyectados (el metadato no
  // cambia los pixeles), asi que se puede previsualizar el archivo original
  // tal cual se solto, sin esperar a procesarlo en el servidor.
  import('three').then(THREE => {
    import('three/addons/controls/OrbitControls.js').then(({ OrbitControls }) => {
      import('three/addons/controls/DeviceOrientationControls.js').then(({ DeviceOrientationControls }) => {
        iniciarVisor360(THREE, OrbitControls, DeviceOrientationControls);
      });
    });
  });

  function iniciarVisor360(THREE, OrbitControls, DeviceOrientationControls) {
    const wrap = document.getElementById('previewCanvasWrap');
    const previewBox = document.getElementById('previewBox');
    const previewTitulo = document.getElementById('previewTitulo');
    const btnGiroscopio = document.getElementById('btnGiroscopio');
    const btnFullscreen = document.getElementById('btnFullscreen');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, wrap.clientWidth / wrap.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    wrap.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1); // se ve desde adentro de la esfera, como el visor de Facebook

    const material = new THREE.MeshBasicMaterial({ color: 0x111318 });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    camera.position.set(0, 0, 0.1);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enablePan = false;
    orbitControls.enableZoom = true;
    orbitControls.rotateSpeed = -0.4; // invertido: se siente como "agarrar" la esfera y girarla
    orbitControls.minDistance = 0.01;
    orbitControls.maxDistance = 1;
    orbitControls.target.set(0, 0, 0);

    let deviceControls = null;
    let usandoGiroscopio = false;

    function animate() {
      requestAnimationFrame(animate);
      if (usandoGiroscopio && deviceControls) {
        deviceControls.update();
      } else {
        orbitControls.update();
      }
      renderer.render(scene, camera);
    }
    animate();

    function ajustarTamano() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w === 0 || h === 0) return; // el panel todavia esta oculto (display:none)
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', ajustarTamano);

    const loader = new THREE.TextureLoader();

    window.mostrarVista360 = function (i) {
      previewIndex = i;
      renderLista();
      const archivo = archivos[i];
      previewTitulo.textContent = 'Vista previa 360 — ' + archivo.name;
      previewBox.classList.add('visible');
      // el panel recien ahora tiene ancho/alto reales (dejaba de ser display:none)
      requestAnimationFrame(ajustarTamano);

      const url = URL.createObjectURL(archivo);
      loader.load(url, (textura) => {
        textura.encoding = THREE.sRGBEncoding;
        material.map = textura;
        material.color.set(0xffffff);
        material.needsUpdate = true;
        URL.revokeObjectURL(url);
      });

      previewBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    btnGiroscopio.addEventListener('click', async () => {
      if (usandoGiroscopio) {
        usandoGiroscopio = false;
        btnGiroscopio.classList.remove('on');
        btnGiroscopio.textContent = 'Activar giroscopio (celular)';
        return;
      }

      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permiso = await DeviceOrientationEvent.requestPermission();
          if (permiso !== 'granted') {
            alert('Sin permiso de orientacion del dispositivo no se puede probar el giroscopio.');
            return;
          }
        }
        if (!deviceControls) {
          deviceControls = new DeviceOrientationControls(camera);
        }
        deviceControls.connect();
        usandoGiroscopio = true;
        btnGiroscopio.classList.add('on');
        btnGiroscopio.textContent = 'Giroscopio activo (tocar para volver al mouse)';
      } catch (e) {
        alert('Este dispositivo/navegador no soporta el sensor de orientacion: ' + e.message);
      }
    });

    btnFullscreen.addEventListener('click', () => {
      if (wrap.requestFullscreen) wrap.requestFullscreen();
    });
  }
</script>
</body>
</html>
